[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ccmt"
version = "0.1.0"
description = "Migrate a legacy or outsourced IVR onto Amazon Connect: convert call trees to contact flows, plan number cutover waves, reconcile traffic."
readme = "README.md"
license = "MIT"
authors = [{ name = "Rexhino Kovaci" }]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.14", "mypy>=1.18", "types-PyYAML>=6.0"]

[project.scripts]
ccmt = "ccmt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ccmt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "C4"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
files = ["src/ccmt"]
